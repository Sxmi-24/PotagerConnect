version: '3.8'

services:

  mysql:
    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jardinco

    ports:
      - "3306:3306"

  backend:

    build: ./backend

    ports:
      - "5000:5000"

    depends_on:
      - mysql

  frontend:

    build: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend